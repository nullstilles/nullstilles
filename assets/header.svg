<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="50%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
    <linearGradient id="glass" x1="80" y1="60" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#94a3b8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="120" x2="980" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="card">
      <rect x="48" y="48" width="1104" height="264" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle cx="160" cy="90" r="140" fill="#6366f1" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="1040" cy="270" r="170" fill="#22d3ee" fill-opacity="0.09" filter="url(#blur)"/>
  <circle cx="680" cy="30" r="110" fill="#a78bfa" fill-opacity="0.08" filter="url(#blur)"/>

  <rect x="48" y="48" width="1104" height="264" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="48" y="48" width="1104" height="264" rx="28" fill="none" stroke="url(#accent)" stroke-opacity="0.30"/>

  <g clip-path="url(#card)" opacity="0.9">
    <path d="M48 118 H1152" stroke="#ffffff" stroke-opacity="0.045"/>
    <path d="M48 178 H1152" stroke="#ffffff" stroke-opacity="0.03"/>
    <path d="M48 238 H1152" stroke="#ffffff" stroke-opacity="0.045"/>
    <path d="M320 48 V312" stroke="#ffffff" stroke-opacity="0.03"/>
    <path d="M880 48 V312" stroke="#ffffff" stroke-opacity="0.03"/>
  </g>

  <text x="96" y="138" fill="#6b7c99" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3">SIGNAL // OPEN</text>
  <text x="96" y="188" fill="#e8eefc" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="46" font-weight="700">nullstilles</text>
  <text x="96" y="228" fill="#8b9bb8" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="20">perpetual student · odd experiments · unfinished maps</text>

  <rect x="96" y="252" width="138" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="165" y="275" text-anchor="middle" fill="#b6c2d9" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="14">curious</text>

  <rect x="250" y="252" width="156" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="328" y="275" text-anchor="middle" fill="#b6c2d9" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="14">unfocused</text>

  <rect x="422" y="252" width="168" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="506" y="275" text-anchor="middle" fill="#b6c2d9" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="14">still learning</text>
</svg>
