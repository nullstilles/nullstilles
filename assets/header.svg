<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="45%" stop-color="#101526"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="glass" x1="80" y1="60" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="120" x2="980" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <clipPath id="card">
      <rect x="48" y="48" width="1104" height="264" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle cx="180" cy="100" r="130" fill="#6366f1" fill-opacity="0.14" filter="url(#blur)"/>
  <circle cx="1020" cy="260" r="160" fill="#22d3ee" fill-opacity="0.10" filter="url(#blur)"/>
  <circle cx="640" cy="40" r="100" fill="#a78bfa" fill-opacity="0.10" filter="url(#blur)"/>

  <rect x="48" y="48" width="1104" height="264" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="48" y="48" width="1104" height="264" rx="28" fill="none" stroke="url(#accent)" stroke-opacity="0.28"/>

  <g clip-path="url(#card)">
    <path d="M48 120 H1152" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M48 180 H1152" stroke="#ffffff" stroke-opacity="0.03"/>
    <path d="M48 240 H1152" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>

  <text x="96" y="145" fill="#e8eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">nullstilles</text>
  <text x="96" y="190" fill="#8b9bb8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22">perpetual student · odd experiments · unfinished maps</text>

  <rect x="96" y="220" width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="171" y="247" text-anchor="middle" fill="#b6c2d9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">curious</text>

  <rect x="262" y="220" width="170" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="347" y="247" text-anchor="middle" fill="#b6c2d9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">unfocused</text>

  <rect x="448" y="220" width="160" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="528" y="247" text-anchor="middle" fill="#b6c2d9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">still learning</text>
</svg>
